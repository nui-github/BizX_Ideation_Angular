<svg viewBox="0 0 960 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="design-loop-title design-loop-desc">
  <title id="design-loop-title">วงจรทำงาน Vibe design กับ Claude</title>
  <desc id="design-loop-desc">Swimlane diagram of the six-step design loop between a person and Claude: frame the problem, point at the screen, Claude proposes and the person decides, Claude builds and tests, the person reviews and ships, with a dashed loop back to pointing when the result is not right yet.</desc>
  <defs>
    <marker id="dl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
    <marker id="dl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5df9"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Lane dividers -->
  <line x1="24" y1="40" x2="936" y2="40" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="156" x2="936" y2="156" stroke="rgba(1,1,54,0.12)" stroke-width="1"/>
  <line x1="24" y1="272" x2="936" y2="272" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="104" y1="40" x2="104" y2="272" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane labels -->
  <text x="36" y="96" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif">คน</text>
  <text x="36" y="112" fill="#5b6b83" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">HUMAN</text>
  <text x="36" y="212" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif">Claude</text>
  <text x="36" y="228" fill="#5b6b83" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">AI</text>

  <!-- Arrows (drawn first, so boxes sit on top) -->
  <!-- 1 Frame → Point -->
  <line x1="216" y1="116" x2="236" y2="116" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <!-- 2 Point → Propose (handoff to Claude) -->
  <path d="M 332,116 H 392 Q 400,116 400,124 V 184" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <!-- 3 Propose → Decide (handoff back to the person) -->
  <path d="M 448,212 H 508 Q 516,212 516,204 V 144" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <!-- 4 Decide → Build (handoff to Claude) -->
  <path d="M 564,116 H 624 Q 632,116 632,124 V 184" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <!-- 5 Build → Verify -->
  <line x1="680" y1="212" x2="700" y2="212" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <!-- 6 Verify → Review (handoff back to the person) -->
  <line x1="748" y1="184" x2="748" y2="144" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <!-- 7 Review → Ship (the person closes the work) -->
  <line x1="796" y1="116" x2="816" y2="116" stroke="#1f5df9" stroke-width="1.4" marker-end="url(#dl-arrow-accent)"/>
  <!-- 8 Review → Point (not right yet: loop back) -->
  <path d="M 748,88 V 76 Q 748,68 740,68 H 292 Q 284,68 284,76 V 88" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dl-arrow)"/>

  <!-- Arrow labels -->
  <rect x="472" y="44" width="88" height="16" rx="2" fill="#f8fafc"/>
  <text x="516" y="56" fill="#5b6b83" font-size="12" font-weight="500" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ยังไม่ตรงใจ</text>

  <!-- Steps -->
  <!-- frame -->
  <rect x="120" y="88" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="120" y="88" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="128" y="94" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="136" y="103" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
  <text x="168" y="122" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ตั้งโจทย์</text>
  <text x="168" y="136" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">frame</text>
  <!-- point -->
  <rect x="236" y="88" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="236" y="88" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="244" y="94" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="252" y="103" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text>
  <text x="284" y="122" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ชี้จุด</text>
  <text x="284" y="136" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">point</text>
  <!-- propose -->
  <rect x="352" y="184" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="352" y="184" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="360" y="190" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="368" y="199" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text>
  <text x="400" y="218" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">เสนอทาง</text>
  <text x="400" y="232" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">propose</text>
  <!-- decide -->
  <rect x="468" y="88" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="468" y="88" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="476" y="94" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="484" y="103" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text>
  <text x="516" y="122" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ตัดสิน</text>
  <text x="516" y="136" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">decide</text>
  <!-- build -->
  <rect x="584" y="184" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="584" y="184" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="592" y="190" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="600" y="199" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text>
  <text x="632" y="218" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ลงมือสร้าง</text>
  <text x="632" y="232" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">build</text>
  <!-- verify -->
  <rect x="700" y="184" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="700" y="184" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="708" y="190" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="716" y="199" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text>
  <text x="748" y="218" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ทดสอบ</text>
  <text x="748" y="232" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verify</text>
  <!-- review -->
  <rect x="700" y="88" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="700" y="88" width="96" height="56" rx="6" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <rect x="708" y="94" width="16" height="12" rx="2" fill="transparent" stroke="#010136" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="716" y="103" fill="#010136" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text>
  <text x="748" y="122" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">รีวิว</text>
  <text x="748" y="136" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">review</text>
  <!-- ship -->
  <rect x="816" y="88" width="96" height="56" rx="6" fill="#f8fafc"/>
  <rect x="816" y="88" width="96" height="56" rx="6" fill="rgba(31,93,249,0.08)" stroke="#1f5df9" stroke-width="1"/>
  <rect x="824" y="94" width="16" height="12" rx="2" fill="transparent" stroke="#1f5df9" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="832" y="103" fill="#1f5df9" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text>
  <text x="864" y="122" fill="#010136" font-size="12" font-weight="600" font-family="'IBM Plex Sans Thai', system-ui, sans-serif" text-anchor="middle">ปิดงาน</text>
  <text x="864" y="136" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">commit & push</text>

  <!-- Legend -->
  <line x1="24" y1="292" x2="936" y2="292" stroke="rgba(1,1,54,0.12)" stroke-width="0.8"/>
  <text x="24" y="312" fill="#5b6b83" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="120" y="303" width="14" height="10" rx="2" fill="#ffffff" stroke="#010136" stroke-width="1"/>
  <text x="140" y="313" fill="#475569" font-size="12" font-weight="500" font-family="'IBM Plex Sans Thai', system-ui, sans-serif">ขั้นตอน (เลขคือขั้นที่)</text>
  <rect x="292" y="303" width="14" height="10" rx="2" fill="rgba(31,93,249,0.08)" stroke="#1f5df9" stroke-width="1"/>
  <text x="312" y="313" fill="#475569" font-size="12" font-weight="500" font-family="'IBM Plex Sans Thai', system-ui, sans-serif">จุดที่คนสั่งปิดงาน</text>
  <line x1="460" y1="308" x2="488" y2="308" stroke="#475569" stroke-width="1.2" marker-end="url(#dl-arrow)"/>
  <text x="496" y="313" fill="#475569" font-size="12" font-weight="500" font-family="'IBM Plex Sans Thai', system-ui, sans-serif">ลำดับ / ส่งต่อ</text>
  <line x1="620" y1="308" x2="648" y2="308" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dl-arrow)"/>
  <text x="656" y="313" fill="#475569" font-size="12" font-weight="500" font-family="'IBM Plex Sans Thai', system-ui, sans-serif">วนกลับถ้ายังไม่ตรงใจ</text>
</svg>
