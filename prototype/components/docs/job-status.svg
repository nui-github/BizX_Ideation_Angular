<svg viewBox="0 0 1072 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="js-title js-desc">
<title id="js-title">สถานะของงาน (Job status)</title>
<desc id="js-desc">State machine of a comparison job: blocked until the previous job is ready, pending, processing, review, and ready; a ready job can be rejected by the next job and returns to processing when its files are read and compared again.</desc>
