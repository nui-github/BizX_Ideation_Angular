<title id="dcf-title">เส้นทางของ Shipment ในระบบ Data Comparison</title>
<desc id="dcf-desc">Swimlane diagram of one shipment through Data Comparison across three lanes (user, OCR and compare engine, shipment sequence): create the shipment, upload files, OCR read, compare by rule, review mismatches, press Done, then unlock the next job or finish; dashed loops return to upload.</desc>
